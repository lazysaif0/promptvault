name: Validate

# Runs on every pull request and push: checks the prompt data, runs the tests,
# and makes sure the static site still builds with no broken links.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate prompts.json
        run: python tools/validate_prompts.py
      - name: Run tests
        run: python -m unittest discover tests
      - name: Build the static site (includes a link check)
        run: python tools/build_static.py --out "$RUNNER_TEMP/dist" --base /preview
